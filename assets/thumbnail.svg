<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="auto">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0e1320"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#7928ca" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff007f" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" rx="16"/>

  <!-- Browser Frame Window -->
  <g filter="url(#shadow)" transform="translate(40, 30)">
    <!-- Window Border & Outer Shell -->
    <rect width="1120" height="570" rx="14" fill="#0d111c" stroke="url(#borderGrad)" stroke-width="2"/>
    
    <!-- Window Top Header Bar -->
    <rect width="1120" height="48" rx="14" fill="#141a29"/>
    <rect y="36" width="1120" height="12" fill="#141a29"/>
    <line x1="0" y1="48" x2="1120" y2="48" stroke="#222b40" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="6" fill="#ef4444"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b"/>
    <circle cx="68" cy="24" r="6" fill="#10b981"/>

    <!-- URL Bar Simulator -->
    <rect x="180" y="10" width="760" height="28" rx="6" fill="#090d16" stroke="#232d42" stroke-width="1"/>
    <text x="200" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#10b981" font-weight="bold">🔒 https://</text>
    <text x="270" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">tayier.snorbik.com/projects</text>
    <text x="490" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">── Powered by SNORBIK Projects Viewer SDK [Production Live · HTTP 200]</text>

    <!-- Content Area: Hero & Projects Presentation -->
    <g transform="translate(40, 75)">
      <!-- Badge Category -->
      <rect x="0" y="0" width="220" height="26" rx="13" fill="#00f0ff" fill-opacity="0.12" stroke="#00f0ff" stroke-width="1"/>
      <text x="110" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#00f0ff" font-weight="bold" text-anchor="middle">⚡ APPLIED AI ENGINEER SHOWCASE</text>

      <!-- Main Title -->
      <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" fill="#ffffff" font-weight="800">
        Tayier Nimait <tspan fill="#94a3b8" font-weight="400">· Showroom &amp; Réalisations IA</tspan>
      </text>

      <!-- Subtitle & Value Proposition -->
      <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#94a3b8">
        Systèmes d'IA Appliquée · Architectures Multi-Agents FastMCP · Modèles Souverains Locaux &amp; Clean Architecture
      </text>

      <!-- 3 Real Project Cards Row -->
      <g transform="translate(0, 130)">
        <!-- Card 1: FastMCP Factory -->
        <g transform="translate(0, 0)">
          <rect width="326" height="190" rx="10" fill="#141a29" stroke="#222b40" stroke-width="1"/>
          <rect x="16" y="16" width="70" height="20" rx="4" fill="#00f0ff" fill-opacity="0.15"/>
          <text x="51" y="30" font-family="sans-serif" font-size="10" fill="#00f0ff" font-weight="bold" text-anchor="middle">FASTMCP</text>
          <text x="16" y="65" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">MCP Application Factory</text>
          <text x="16" y="88" font-family="sans-serif" font-size="12" fill="#94a3b8">Usine industrielle de serveurs</text>
          <text x="16" y="106" font-family="sans-serif" font-size="12" fill="#94a3b8">hybrides Tri-Canal (stdio, CLI, SDK).</text>
          <text x="16" y="130" font-family="sans-serif" font-size="11" fill="#64748b">Python · FastMCP · Clean Arch · Docker</text>
          <text x="16" y="165" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="bold">🟢 8 Serveurs Prod · 25 Outils</text>
        </g>

        <!-- Card 2: Forward IA Sovereign -->
        <g transform="translate(356, 0)">
          <rect width="326" height="190" rx="10" fill="#141a29" stroke="#222b40" stroke-width="1"/>
          <rect x="16" y="16" width="95" height="20" rx="4" fill="#7928ca" fill-opacity="0.2"/>
          <text x="63" y="30" font-family="sans-serif" font-size="10" fill="#c084fc" font-weight="bold" text-anchor="middle">SOVEREIGN AI</text>
          <text x="16" y="65" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">Forward IA Platform</text>
          <text x="16" y="88" font-family="sans-serif" font-size="12" fill="#94a3b8">Plateforme souveraine locale</text>
          <text x="16" y="106" font-family="sans-serif" font-size="12" fill="#94a3b8">28 LLMs d'inférence (Ollama, vLLM).</text>
          <text x="16" y="130" font-family="sans-serif" font-size="11" fill="#64748b">Python 3.12 · FastAPI · Redis · React</text>
          <text x="16" y="165" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="bold">🟢 Opérationnel · Hébergé VPS</text>
        </g>

        <!-- Card 3: BatiHome AxeSteel -->
        <g transform="translate(712, 0)">
          <rect width="326" height="190" rx="10" fill="#141a29" stroke="#222b40" stroke-width="1"/>
          <rect x="16" y="16" width="85" height="20" rx="4" fill="#ff007f" fill-opacity="0.15"/>
          <text x="58" y="30" font-family="sans-serif" font-size="10" fill="#ff4d94" font-weight="bold" text-anchor="middle">COPILOTE 3D</text>
          <text x="16" y="65" font-family="sans-serif" font-size="16" fill="#ffffff" font-weight="bold">BatiHome AxeSteel</text>
          <text x="16" y="88" font-family="sans-serif" font-size="12" fill="#94a3b8">Devis garde-corps en langage</text>
          <text x="16" y="106" font-family="sans-serif" font-size="12" fill="#94a3b8">naturel &amp; chiffrage NF P01-012.</text>
          <text x="16" y="130" font-family="sans-serif" font-size="11" fill="#64748b">FastAPI · SQLite · Three.js · 13 MCPs</text>
          <text x="16" y="165" font-family="sans-serif" font-size="11" fill="#10b981" font-weight="bold">🟢 Production VPS Hostinger</text>
        </g>
      </g>

      <!-- Bottom Interactive Call to Action Banner -->
      <g transform="translate(0, 350)">
        <rect width="1040" height="60" rx="10" fill="url(#btnGrad)"/>
        <text x="520" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">
          🚀 CLIQUER POUR OUVRIR LE PORTFOLIO INTERACTIF COMPLET EN LIGNE (HÉBERGÉ SUR HOSTINGER) ↗
        </text>
      </g>
    </g>
  </g>
</svg>
